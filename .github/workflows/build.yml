name: Build prebuilt

# Manual trigger: build the win32-x64 prebuilt .node and commit it back into the repo.
# Single target only (win32-x64, D-10); win32-arm64 is a noted fast-follow.
on:
  workflow_dispatch

permissions:
  contents: write # required to commit the prebuilt back to the repo

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check native code
        run: cargo clippy --target x86_64-pc-windows-msvc

      - name: Build .node
        shell: pwsh
        run: |
          bun install
          bun x napi build --release --target x86_64-pc-windows-msvc
          # napi emits `wasapi-loopback.win32-x64-msvc.node` (or similar). Normalize to the
          # EXACT glob-matched name `wasapi-loopback-win32-x64.node` (must contain BOTH win32
          # AND x64 — required by GoofCord's nativeImport.ts substring glob) at the precise
          # path GoofCord's build.ts reads: prebuilds/windows-x86_64/.
          # Only accept freshly emitted root-level output, never an old committed prebuild.
          $nodes = @(Get-ChildItem -Path . -Filter "*.node" -File)
          if ($nodes.Count -ne 1) { throw "Expected exactly one freshly built root-level .node; found $($nodes.Count)" }
          $node = $nodes[0]
          New-Item -ItemType Directory -Force -Path prebuilds/windows-x86_64 | Out-Null
          Copy-Item $node.FullName prebuilds/windows-x86_64/wasapi-loopback-win32-x64.node -Force
          Write-Host "wasapi addon built: $($node.FullName) -> prebuilds/windows-x86_64/wasapi-loopback-win32-x64.node"

      - name: Verify addon API
        shell: pwsh
        run: |
          node -e "const a = require('./prebuilds/windows-x86_64/wasapi-loopback-win32-x64.node'); for (const k of ['startExcludeProcessTree', 'startIncludeProcessTree', 'stopSession', 'stopAll', 'listAudioApps', 'getCaptureStats', 'listRenderEndpoints', 'startRenderEndpointLoopback']) { if (typeof a[k] !== 'function') throw Error('Missing WASAPI export: ' + k); } a.stopAll(); console.log(Object.keys(a));"

      - name: Upload prebuilt
        uses: actions/upload-artifact@v4
        with:
          name: wasapi-addon
          path: prebuilds/windows-x86_64/wasapi-loopback-win32-x64.node
          if-no-files-found: error

      - name: Commit prebuilt
        shell: pwsh
        run: |
          git config user.name  "Thomas Quant"
          git config user.email "214925194+thomas-quant@users.noreply.github.com"
          # .gitignore ignores *.node; the prebuilds/ negation is the intended exception, and
          # `-f` is the belt-and-suspenders backstop so the prebuilt is always staged.
          git add -f prebuilds/windows-x86_64/wasapi-loopback-win32-x64.node
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "ci: prebuilt win32-x64"
            git push
          } else {
            Write-Host "No prebuild change to commit."
          }
